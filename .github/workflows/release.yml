name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'SupiVPN/supivpn'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag and collect its successful native builds
        env:
          GH_TOKEN: ${{ github.token }}
          SUPIVPN_TAG_VERSION: ${{ inputs.tag }}
          SUPIVPN_GPG_PUBLIC_KEY: ${{ vars.SUPIVPN_GPG_PUBLIC_KEY }}
        run: python3 -B tools/github_release.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}
          path: out/github-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  sign:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.repository == 'SupiVPN/supivpn'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.run_id }}
          path: out/github-release/
      - name: Sign and verify release checksums
        env:
          SUPIVPN_TAG_VERSION: ${{ inputs.tag }}
          SUPIVPN_ARTIFACT_SIGNING_KEY: ${{ secrets.SUPIVPN_ARTIFACT_SIGNING_KEY }}
          SUPIVPN_ARTIFACT_SIGNING_PASSPHRASE: ${{ secrets.SUPIVPN_ARTIFACT_SIGNING_PASSPHRASE }}
        run: python3 -B tools/github_release.py sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-${{ github.run_id }}
          path: out/github-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: sign
    if: github.ref == 'refs/heads/main' && github.repository == 'SupiVPN/supivpn'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-${{ github.run_id }}
          path: out/github-release/
      - name: Verify signatures and publish release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPIVPN_TAG_VERSION: ${{ inputs.tag }}
          SUPIVPN_RELEASE_PUBLISH: '1'
          SUPIVPN_GPG_PUBLIC_KEY: ${{ vars.SUPIVPN_GPG_PUBLIC_KEY }}
        run: python3 -B tools/github_release.py publish
