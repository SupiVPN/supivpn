name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'SupiVPN/supivpn'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag and collect its successful native builds
        env:
          GH_TOKEN: ${{ github.token }}
          SUPIVPN_TAG_VERSION: ${{ inputs.tag }}
          SUPIVPN_GPG_PUBLIC_KEY: ${{ vars.SUPIVPN_GPG_PUBLIC_KEY }}
        run: python3 -B tools/github_release.py prepare
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.run_id }}
          path: out/github-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  sign:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.repository == 'SupiVPN/supivpn'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ github.run_id }}
          path: out/github-release/
      - name: Sign and verify release checksums
        env:
          SUPIVPN_TAG_VERSION: ${{ inputs.tag }}
          SUPIVPN_ARTIFACT_SIGNING_KEY: ${{ secrets.SUPIVPN_ARTIFACT_SIGNING_KEY }}
          SUPIVPN_ARTIFACT_SIGNING_PASSPHRASE: ${{ secrets.SUPIVPN_ARTIFACT_SIGNING_PASSPHRASE }}
        run: python3 -B tools/github_release.py sign
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-${{ github.run_id }}
          path: out/github-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  publish:
    needs: sign
    if: github.ref == 'refs/heads/main' && github.repository == 'SupiVPN/supivpn'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-release-${{ github.run_id }}
          path: out/github-release/
      - name: Verify signatures and publish release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPIVPN_TAG_VERSION: ${{ inputs.tag }}
          SUPIVPN_RELEASE_PUBLISH: '1'
          SUPIVPN_GPG_PUBLIC_KEY: ${{ vars.SUPIVPN_GPG_PUBLIC_KEY }}
        run: python3 -B tools/github_release.py publish
